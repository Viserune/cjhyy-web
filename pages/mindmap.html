<!--/* AI辅助生成:使用deepseek-R1/deepseek-v3 ,2026-2 */-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>春江花月夜 - 思维导图与AI作画</title>
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
    <script src="../assets/config.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'STKaiti', 'KaiTi', 'FangSong', 'Songti SC', serif;
            background: #1f140d;
            color: #f2dfbe;
            padding: 20px;
            overflow-x: hidden;
            background-image: url('../assets/images/background3.jpg');
            background-size: cover;
            background-attachment: fixed;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(29, 16, 8, 0.56), rgba(58, 32, 18, 0.36));
            z-index: -1;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 40px;
            padding-bottom: 100px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 3em;
            text-shadow: 0 3px 10px rgba(20, 11, 6, 0.65);
            margin-bottom: 10px;
            letter-spacing: 5px;
        }

        h2 {
            border-left: 5px solid rgba(120, 80, 46, 0.9);
            padding-left: 15px;
            margin-bottom: 20px;
            font-size: 1.8em;
            color: #5a351f;
        }

        .section {
            background: linear-gradient(155deg, rgba(241, 224, 189, 0.95), rgba(214, 181, 129, 0.92));
            border-radius: 15px;
            padding: 30px;
            border: 2px solid rgba(108, 70, 39, 0.75);
            box-shadow: 0 10px 30px rgba(26, 14, 7, 0.45);
            transition: transform 0.3s;
        }
        
        .section:hover {
            transform: translateY(-5px);
        }

        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        button {
            padding: 12px 30px;
            border-radius: 25px;
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
            background: linear-gradient(180deg, rgba(194, 79, 57, 0.95), rgba(157, 52, 35, 0.92));
            color: #fbe9cf;
            box-shadow: 0 4px 15px rgba(82, 35, 22, 0.4);
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(82, 35, 22, 0.55);
        }

        button:disabled {
            background: #636e72;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .input-group {
            flex: 1;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 20px;
            border-radius: 25px;
            border: 1px solid rgba(132, 95, 58, 0.5);
            background: rgba(255, 246, 224, 0.9);
            color: #4f2f1b;
            outline: none;
        }

        .result-box {
            min-height: 400px;
            background: rgba(255, 248, 233, 0.72);
            border-radius: 10px;
            padding: 20px;
            position: relative;
            overflow: auto;
            border: 1px solid rgba(132, 95, 58, 0.35);
        }
        
        #map-box {
            min-height: 520px;
            cursor: grab;
        }

        #map-box.dragging {
            cursor: grabbing;
        }
        
        #map-viewport {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 160px;
        }
        
        /* Mermaid specific styles */
        #mermaid-container {
            width: max-content;
            text-align: left;
        }

        #mermaid-container svg {
            max-width: none !important;
            height: auto;
            display: block;
        }

        /* Image result */
        #image-result img {
            max-width: 100%;
            max-height: 600px;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            transition: opacity 1s;
        }

        .loading-spinner {
            border: 4px solid rgba(132, 95, 58, 0.2);
            border-left-color: #c24f39;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .status-msg {
            margin-left: 15px;
            font-size: 14px;
            opacity: 0.8;
        }
        
        .api-warning {
            color: #ff7675;
            font-size: 0.9em;
            margin-top: 5px;
            display: none;
        }

        .zoom-controls {
            position: absolute;
            top: 14px;
            right: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 2;
        }

        .zoom-controls.is-hidden {
            display: none;
        }

        .zoom-controls button {
            width: 36px;
            height: 36px;
            padding: 0;
            border-radius: 50%;
            font-size: 16px;
            line-height: 36px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(108, 92, 231, 0.4);
        }

        .limit-hint {
            margin-left: 10px;
            font-size: 13px;
            opacity: 0.85;
            color: #6f4228;
        }
    </style>
    <link rel="stylesheet" href="../assets/night-theme.css">
</head>
<body class="moonlit-night">
    <div class="container">
        <header>
            <h1>图解 · 春江花月夜</h1>
        </header>

        <!-- 思维导图部分 -->
        <section class="section" id="mindmap-section">
            <h2>01. 知识脉络 (Mind Map)</h2>
            <div class="controls">
                <button id="btn-gen-map">生成思维导图</button>
                <span class="status-msg" id="status-map">点击按钮生成全诗深度解析...</span>
            </div>
            <div class="result-box" id="map-box">
                <div class="zoom-controls" aria-label="缩放控制">
                    <button id="btn-zoom-in" type="button" title="放大" aria-label="放大">+</button>
                    <button id="btn-zoom-reset" type="button" title="重置" aria-label="重置">R</button>
                    <button id="btn-zoom-out" type="button" title="缩小" aria-label="缩小">-</button>
                </div>
                <div id="map-viewport">
                    <div id="mermaid-container"></div>
                </div>
            </div>
        </section>

        <!-- AI作画部分 -->
        <section class="section" id="painting-section">
            <h2>02. 意境重现 (AI Painting)</h2>
            <div class="controls">
                <button id="btn-gen-img">生成春江月夜图</button>
                <span id="img-limit-msg" class="limit-hint">剩余生成次数：3</span>
                <div class="input-group">
                    <input type="text" id="img-prompt" value="中国传统水墨画，春江花月夜，月亮高悬，江水流淌，花林如霰，空灵寂静，高细节，大师级作品" placeholder="输入画作描述...">
                </div>
            </div>
            <div class="api-warning" id="api-warning">请先在 assets/config.js 中配置阿里云 API Key</div>
            <div class="result-box" id="image-box">
                <div id="image-placeholder" style="color: rgba(255,255,255,0.3);">画作将在此显示</div>
                <div id="image-result"></div>
            </div>
        </section>
    </div>

    <script>
        // 初始化 Mermaid
        mermaid.initialize({ 
            startOnLoad: false,
            theme: 'dark',
            securityLevel: 'loose',
            fontFamily: 'STKaiti, KaiTi, FangSong, Songti SC, serif'
        });

        const btnGenMap = document.getElementById('btn-gen-map');
        const statusMap = document.getElementById('status-map');
        const mapBox = document.getElementById('map-box');
        const zoomControls = document.querySelector('#map-box .zoom-controls');
        const btnZoomIn = document.getElementById('btn-zoom-in');
        const btnZoomOut = document.getElementById('btn-zoom-out');
        const btnZoomReset = document.getElementById('btn-zoom-reset');

        const btnGenImg = document.getElementById('btn-gen-img');
        const imgPrompt = document.getElementById('img-prompt');
        const imageBox = document.getElementById('image-box');
        const imageResult = document.getElementById('image-result');
        const imagePlaceholder = document.getElementById('image-placeholder');
        const apiWarning = document.getElementById('api-warning');
        const imgLimitMsg = document.getElementById('img-limit-msg');

        let resolvedImageProxyUrl = '';

        const IMAGE_LIMIT = 3;
        let localImageUsed = 0;

        let mapScale = 1;
        const MAP_MIN_SCALE = 0.5;
        const MAP_MAX_SCALE = 2.5;
        const MAP_STEP = 0.1;
        const MAP_PADDING = 160;

        function buildImageProxyCandidates() {
            const candidates = [];
            const configuredProxy = APP_CONFIG.aliyun && APP_CONFIG.aliyun.proxyUrl
                ? String(APP_CONFIG.aliyun.proxyUrl).trim()
                : '';

            if (configuredProxy) {
                candidates.push(configuredProxy);
            }

            const isLocalHost = ['localhost', '127.0.0.1'].includes(window.location.hostname);
            if (isLocalHost) {
                candidates.push('http://localhost:5001/proxy/aliyun/image');
                candidates.push('http://127.0.0.1:5001/proxy/aliyun/image');
            } else {
                candidates.push(`${window.location.origin}/image-api/proxy/aliyun/image`);
            }

            return [...new Set(candidates)];
        }

        async function probeImageProxy(url) {
            const healthUrl = url.replace('/proxy/aliyun/image', '/health');
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 2500);
            try {
                const response = await fetch(healthUrl, {
                    method: 'GET',
                    signal: controller.signal
                });
                return response.ok;
            } catch (error) {
                return false;
            } finally {
                clearTimeout(timer);
            }
        }

        async function resolveImageProxyUrl() {
            if (resolvedImageProxyUrl) {
                return resolvedImageProxyUrl;
            }

            const candidates = buildImageProxyCandidates();
            for (const candidate of candidates) {
                const available = await probeImageProxy(candidate);
                if (available) {
                    resolvedImageProxyUrl = candidate;
                    return candidate;
                }
            }

            return '';
        }

        let mapBaseWidth = 0;
        let mapBaseHeight = 0;

        let isDraggingMap = false;
        let dragStartX = 0;
        let dragStartY = 0;
        let dragStartScrollLeft = 0;
        let dragStartScrollTop = 0;

        function getCurrentMermaidNode() {
            return document.querySelector('#map-box #mermaid-container');
        }

        function getMapViewport() {
            return document.querySelector('#map-box #map-viewport');
        }

        function applyMapScale() {
            const currentMermaid = getCurrentMermaidNode();
            if (!currentMermaid) return;
            const svg = currentMermaid.querySelector('svg');
            if (!svg || !mapBaseWidth || !mapBaseHeight) return;
            const mapViewport = getMapViewport();

            const nextWidth = Math.max(600, Math.round(mapBaseWidth * mapScale));
            const nextHeight = Math.max(360, Math.round(mapBaseHeight * mapScale));
            svg.style.width = `${nextWidth}px`;
            svg.style.height = `${nextHeight}px`;

            if (mapViewport) {
                mapViewport.style.minWidth = `${nextWidth + MAP_PADDING * 2}px`;
                mapViewport.style.minHeight = `${nextHeight + MAP_PADDING * 2}px`;
                mapViewport.style.padding = `${MAP_PADDING}px`;
            }
        }

        function normalizeMermaidSvgSize() {
            const currentMermaid = getCurrentMermaidNode();
            if (!currentMermaid) return;
            const svg = currentMermaid.querySelector('svg');
            if (!svg) return;

            const viewBox = svg.getAttribute('viewBox');
            if (viewBox) {
                const parts = viewBox.split(/\s+/).map(Number);
                if (parts.length === 4 && Number.isFinite(parts[2]) && Number.isFinite(parts[3])) {
                    mapBaseWidth = Math.max(900, Math.ceil(parts[2]));
                    mapBaseHeight = Math.max(520, Math.ceil(parts[3]));
                }
            }

            if (!mapBaseWidth || !mapBaseHeight) {
                const rect = svg.getBoundingClientRect();
                mapBaseWidth = Math.max(900, Math.round(rect.width || 900));
                mapBaseHeight = Math.max(520, Math.round(rect.height || 520));
            }

            svg.style.maxWidth = 'none';
            mapScale = 1;
            applyMapScale();
        }

        function centerMapView() {
            mapBox.scrollLeft = Math.max(0, (mapBox.scrollWidth - mapBox.clientWidth) / 2);
            mapBox.scrollTop = Math.max(0, (mapBox.scrollHeight - mapBox.clientHeight) / 2);
        }

        function updateLimitHint(remaining) {
            imgLimitMsg.textContent = `剩余生成次数：${remaining}`;
        }

        btnZoomIn.addEventListener('click', () => {
            mapScale = Math.min(MAP_MAX_SCALE, +(mapScale + MAP_STEP).toFixed(2));
            applyMapScale();
        });

        btnZoomOut.addEventListener('click', () => {
            mapScale = Math.max(MAP_MIN_SCALE, +(mapScale - MAP_STEP).toFixed(2));
            applyMapScale();
        });

        btnZoomReset.addEventListener('click', () => {
            mapScale = 1;
            applyMapScale();
            centerMapView();
        });

        mapBox.addEventListener('mousedown', (event) => {
            if (event.button !== 0) return;
            isDraggingMap = true;
            mapBox.classList.add('dragging');
            dragStartX = event.clientX;
            dragStartY = event.clientY;
            dragStartScrollLeft = mapBox.scrollLeft;
            dragStartScrollTop = mapBox.scrollTop;
            event.preventDefault();
        });

        document.addEventListener('mousemove', (event) => {
            if (!isDraggingMap) return;
            const deltaX = event.clientX - dragStartX;
            const deltaY = event.clientY - dragStartY;
            mapBox.scrollLeft = dragStartScrollLeft - deltaX;
            mapBox.scrollTop = dragStartScrollTop - deltaY;
        });

        document.addEventListener('mouseup', () => {
            if (!isDraggingMap) return;
            isDraggingMap = false;
            mapBox.classList.remove('dragging');
        });

        mapBox.addEventListener('mouseleave', () => {
            if (!isDraggingMap) return;
            isDraggingMap = false;
            mapBox.classList.remove('dragging');
        });

        // 检查配置
        if (!APP_CONFIG.aliyun || APP_CONFIG.aliyun.apiKey === 'YOUR_DASHSCOPE_API_KEY') {
            apiWarning.style.display = 'block';
        }

        // ==========================================
        // 1. 生成思维导图 (使用 DeepSeek)
        // ==========================================
        btnGenMap.addEventListener('click', async () => {
            if (!APP_CONFIG.deepseek || !APP_CONFIG.deepseek.apiKey) {
                alert('请先配置 DeepSeek API Key');
                return;
            }

            btnGenMap.disabled = true;
            statusMap.textContent = '正在构思导图结构...';
            const mapViewport = getMapViewport();
            if (mapViewport) {
                mapViewport.innerHTML = '<div class="loading-spinner"></div>';
            }

            const systemPrompt = `你是一个文学专家。请为唐代诗人张若虚的《春江花月夜》生成一个详细的思维导图，使用 Mermaid JS 的 graph TD 格式。
            
            要求：
            1. 根节点是"春江花月夜"。
            2. 分支包含：写景（春江、月亮、花林）、叙事（游子、思妇）、哲理（宇宙永恒、人生代代）。
            3. 包含具体诗句的关键词引用。
            4. **只返回 Mermaid 代码本身**，不要包含 \`\`\`mermaid 标记，不要包含任何解释性文字。
            5. 确保代码语法正确，没有任何非法字符。`;

            try {
                const response = await fetch(APP_CONFIG.deepseek.apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${APP_CONFIG.deepseek.apiKey}`
                    },
                    body: JSON.stringify({
                        model: APP_CONFIG.deepseek.model || 'deepseek-chat',
                        messages: [
                            { role: "system", content: systemPrompt },
                            { role: "user", content: "开始分析，生成Mermaid代码。" }
                        ],
                        temperature: 0.3
                    })
                });

                if (!response.ok) throw new Error('API请求失败');
                
                const data = await response.json();
                let content = data.choices[0].message.content;

                // 清洗数据，去除可能的 Markdown 标记
                content = content.replace(/```mermaid/g, '').replace(/```/g, '').trim();

                statusMap.textContent = '渲染导图中...';
                const mapViewport = getMapViewport();
                if (mapViewport) {
                    mapViewport.innerHTML = '<div id="mermaid-container" class="mermaid">' + content + '</div>';
                }
                
                // 重新渲染 Mermaid
                await mermaid.run({
                    nodes: [document.getElementById('mermaid-container')]
                });

                normalizeMermaidSvgSize();
                mapScale = 1;
                applyMapScale();
                centerMapView();

                if (zoomControls) {
                    zoomControls.classList.add('is-hidden');
                }
                
                statusMap.textContent = '思维导图生成完成！';

            } catch (error) {
                console.error(error);
                statusMap.textContent = '生成失败: ' + error.message;
                const mapViewport = getMapViewport();
                if (mapViewport) {
                    mapViewport.innerHTML = '<div style="color:red">生成出错，请重试。<br>' + error.message + '</div>';
                }
            } finally {
                btnGenMap.disabled = false;
            }
        });

        // ==========================================
        // 2. 生成画作 (使用 阿里云 DashScope)
        // ==========================================
        btnGenImg.addEventListener('click', async () => {
            const apiKey = APP_CONFIG.aliyun ? APP_CONFIG.aliyun.apiKey : '';
            if (!apiKey || apiKey === 'YOUR_DASHSCOPE_API_KEY') {
                alert('请先在 config.js 中配置阿里云 API Key');
                return;
            }

            if (localImageUsed >= IMAGE_LIMIT) {
                alert('最多只能生成3次图片');
                btnGenImg.disabled = true;
                updateLimitHint(0);
                return;
            }

            const prompt = imgPrompt.value.trim();
            if (!prompt) return;

            btnGenImg.disabled = true;
            btnGenImg.textContent = '绘画中...';
            imagePlaceholder.style.display = 'none';
            imageResult.innerHTML = '<div class="loading-spinner"></div>';
            localImageUsed += 1;
            updateLimitHint(Math.max(0, IMAGE_LIMIT - localImageUsed));

            try {
                const proxyUrl = await resolveImageProxyUrl();
                if (!proxyUrl) {
                    throw new Error('无法连接文生图服务（5001 端口）。请先运行 python launcher.py 或 python server/img_create.py');
                }

                // 只传入 prompt，apiKey/model 由后端从 assets/config.js 读取
                const submitResponse = await fetch(proxyUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        prompt: prompt
                    })
                });

                if (!submitResponse.ok) {
                    const err = await submitResponse.json().catch(() => ({}));
                    if (submitResponse.status === 429 || err.code === 'GenerationLimitExceeded') {
                        localImageUsed = IMAGE_LIMIT;
                        btnGenImg.disabled = true;
                        updateLimitHint(0);
                    }
                    throw new Error(err.message || '提交任务失败');
                }

                const submitData = await submitResponse.json();
                if (typeof submitData.used === 'number') {
                    localImageUsed = submitData.used;
                    updateLimitHint(Math.max(0, IMAGE_LIMIT - localImageUsed));
                }

                if (localImageUsed >= IMAGE_LIMIT) {
                    btnGenImg.disabled = true;
                }

                let imageUrl = '';
                if (submitData.output && submitData.output.results && submitData.output.results.length > 0) {
                    imageUrl = submitData.output.results[0].url;
                }

                if (imageUrl) {
                    imageResult.innerHTML = `<img src="${imageUrl}" alt="AI Generative Art" onload="notifyCompletion()">`;
                    // 通知主页面任务完成
                    notifyCompletion();
                } else {
                    throw new Error('生成超时');
                }

            } catch (error) {
                console.error(error);
                const message = (error && error.message) ? error.message : '未知错误';
                const friendlyMessage = /Failed to fetch|NetworkError|Load failed/i.test(message)
                    ? '网络请求失败：请确认文生图代理服务已启动（python launcher.py 或 python server/img_create.py），并检查 5001 端口。'
                    : message;
                imageResult.innerHTML = `<div style="color:#ff7675">生成失败: ${friendlyMessage}</div>`;
            } finally {
                btnGenImg.disabled = localImageUsed >= IMAGE_LIMIT;
                btnGenImg.textContent = '生成春江月夜图';
            }
        });

        // 通知主页面本页任务完成
        let isCompleted = false;
        function notifyCompletion() {
            if (isCompleted) return;
            // 简单的逻辑：只要生成了画作就算完成
            if (window.parent !== window) {
                window.parent.postMessage({ type: 'pageCompleted', page: 7 }, '*');
                isCompleted = true;
            }
        }
    </script>
</body>
</html>
