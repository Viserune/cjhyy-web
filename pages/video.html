<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>春江花月夜 - 微课</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'STKaiti', 'KaiTi', 'FangSong', 'Songti SC', serif;
            min-height: 100vh;
            background-image: url('../assets/images/background3.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(30, 16, 8, 0.52), rgba(56, 30, 16, 0.34));
            z-index: -1;
        }
        
        /* 标题页面 */
        #title-page {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            opacity: 1;
            transition: opacity 1s ease-out;
            cursor: pointer;
            z-index: 100;
            pointer-events: auto;
            background: linear-gradient(180deg, rgba(31, 17, 9, 0.52), rgba(58, 31, 17, 0.34));
        }
        #title-page.fade-out {
            opacity: 0;
            pointer-events: none;
        }
        
        .title-container {
            position: relative;
            padding: 60px 80px;
            background:
                linear-gradient(160deg, rgba(245, 230, 198, 0.95), rgba(223, 194, 145, 0.94)),
                repeating-linear-gradient(0deg, rgba(88, 58, 32, 0.05) 0px, rgba(88, 58, 32, 0.05) 1px, transparent 1px, transparent 4px);
            border-radius: 14px;
            box-shadow:
                0 14px 45px rgba(20, 11, 6, 0.45),
                inset 0 0 0 1px rgba(255, 243, 216, 0.78);
            border: 2px solid rgba(113, 74, 42, 0.7);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        #title-page:hover .title-container {
            transform: scale(1.05);
            box-shadow: 0 15px 60px rgba(0, 0, 0, 0.6);
        }
        
        h1 {
            font-size: 72px;
            color: #4d2a16;
            text-shadow: 0 2px 0 rgba(255, 245, 223, 0.75);
            letter-spacing: 12px;
            margin-bottom: 30px;
            font-weight: bold;
        }
        
        .subtitle {
            font-size: 28px;
            color: rgba(78, 45, 24, 0.9);
            text-shadow: 0 1px 0 rgba(255, 248, 228, 0.72);
            letter-spacing: 4px;
            margin-bottom: 20px;
        }
        
        .author {
            font-size: 24px;
            color: rgba(99, 58, 31, 0.85);
            text-shadow: 0 1px 0 rgba(255, 248, 228, 0.65);
            letter-spacing: 3px;
            font-style: italic;
        }
        
        .click-hint {
            margin-top: 40px;
            font-size: 20px;
            color: rgba(106, 36, 27, 0.86);
            text-shadow: 0 1px 0 rgba(255, 244, 218, 0.8);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
        
        .video-container {
            width: 90%;
            max-width: 1500px;
            padding: 10px;
            background:
                linear-gradient(155deg, rgba(240, 223, 188, 0.95), rgba(214, 180, 128, 0.92)),
                repeating-linear-gradient(90deg, rgba(88, 58, 33, 0.05) 0px, rgba(88, 58, 33, 0.05) 1px, transparent 1px, transparent 5px);
            border-radius: 22px;
            box-shadow: 0 20px 70px rgba(18, 10, 5, 0.55);
            border: 2px solid rgba(105, 67, 37, 0.75);
            position: relative;
            flex-shrink: 0;
            opacity: 1;
            transition: opacity 0.5s ease;
        }

        .video-container.is-hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .video-title {
            text-align: center;
            color: #fff;
            font-size: 48px;
            margin-bottom: 30px;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.8);
            letter-spacing: 6px;
        }
        
        .video-wrapper {
            position: relative;
            width: 100%;
            background: transparent;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        }
        
        video {
            width: 100%;
            max-width: 1350px;
            height: auto;
            display: block;
            margin: 0 auto;
        }
        
        /* 缩放遮罩效果 */
        .video-container.zoom {
            animation: zoomPulse 0.8s ease-out;
        }
        
        @keyframes zoomPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
    <link rel="stylesheet" href="../assets/night-theme.css">
</head>
<body class="moonlit-night">
    <!-- 标题页面 -->
    <div id="title-page">
        <div class="title-container">
            <h1>春江花月夜</h1>
            <div class="subtitle">唐代诗歌赏析</div>
            <div class="author">唐 · 张若虚</div>
            <div class="click-hint">点击开始学习 ▶</div>
        </div>
    </div>
    
    <div class="video-container is-hidden" id="video-container">
        <div class="video-wrapper">
            <video id="main-video" playsinline controls preload="none">
                您的浏览器不支持视频播放。
            </video>
        </div>
    </div>
    <script>
        const titlePage = document.getElementById('title-page');
        const mainVideo = document.getElementById('main-video');
        const videoContainer = document.getElementById('video-container');
        const cacheBuster = new URLSearchParams(window.location.search).get('v') || Date.now().toString();

        function assetUrl(path) {
            const sep = path.includes('?') ? '&' : '?';
            return `${path}${sep}v=${encodeURIComponent(cacheBuster)}`;
        }
        
        // 点击标题页，过渡到视频
        titlePage.addEventListener('click', () => {
            titlePage.classList.add('fade-out');
            setTimeout(() => {
                videoContainer.classList.remove('is-hidden');
                mainVideo.src = assetUrl('https://github.com/Viserune/cjhyy-web/releases/download/v1.0.0/chapter1.mp4');
                mainVideo.load();
                mainVideo.muted = false;
                if (window.parent !== window) {
                    window.parent.postMessage({
                        type: 'videoStarted',
                        page: 1
                    }, '*');
                }
                mainVideo.play();
            }, 1000);
        });

        // 单视频播放结束后直接通知主页面进入下一环节
        mainVideo.addEventListener('ended', () => {
            videoContainer.classList.add('zoom');

            if (window.parent !== window) {
                window.parent.postMessage({
                    type: 'pageCompleted',
                    page: 1
                }, '*');
            }
            
            setTimeout(() => {
                videoContainer.classList.remove('zoom');
            }, 800);
        });
        
        // 监听主页面的暂停命令
        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'pause') {
                mainVideo.pause();
            }
        });
    </script>
</body>
</html>
